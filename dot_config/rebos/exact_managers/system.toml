# system

# skip tests, make it go Brrr
add = "paru --needed -S --mflags '--nocheck' --overwrite '*' --noconfirm #:?"
remove = "if pkgs=$(paru -Qq #:? 2>/dev/null); then [ -n \"$pkgs\" ] && paru -Rns $pkgs; fi"
sync = "paru -Syy"
upgrade = "paru -Su --devel"

plural_name = "system-packages"
hook_name = "system-packages"

[config]
many_args = true
arg_sep = " "
