{{ if .isLinux }}
# DRACULA THEME
[".local/share/themes/Dracula"]
    type = "archive"
    url = "https://github.com/dracula/gtk/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".config/qt5ct/colors/Dracula.conf"]
    type = "archive-file"
    url = "https://github.com/dracula/qt5/archive/master.zip"
    refreshPeriod = "168h"
    stripComponents = 1
    path = "Dracula.conf"

[".config/qt6ct/colors/Dracula.conf"]
    type = "archive-file"
    url = "https://github.com/dracula/qt5/archive/master.zip"
    refreshPeriod = "168h"
    stripComponents = 1
    path = "Dracula.conf"

[".config/hypr/hyprsplit"]
    type = "git-repo"
    url = "https://github.com/shezdy/hyprsplit"
    branch = "main"

{{- if (and .isHacking .isLinux) }}
# HACKING

## Active Directory
[".local/bin/kerbrute"]
    type = "archive-file"
    url = '{{ gitHubLatestRelease "0xZDH/kerbrute" | toJson | fromJson | jq ".assets[10].browser_download_url" | first}}'
    path = "kerbrute"
    refreshPeriod = "43200h"
    executable = true

## Cheatsheets
[".local/share/navi/cheats/esp0xdeadbeef"]
    type = "git-repo"
    url = "https://github.com/esp0xdeadbeef/cheat.sheets"
    refreshPeriod = "250h"

{{- end }}
{{- end }}
